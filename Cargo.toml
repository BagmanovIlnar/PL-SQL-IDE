[package]
name = "plsqlide"
version = "0.1.0"
description = "Cross-platform IDE for Oracle PL/SQL and PostgreSQL"
edition = "2021"
rust-version = "1.88"
authors = ["plsqlide"]

[features]
default = ["postgres"]
postgres = []
oracle = ["dep:oracle"]

[dependencies]
iced = { version = "0.14", features = ["highlighter", "tokio", "debug"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["menu"] }
iced_fonts = { version = "0.3", features = ["lucide"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
oracle = { version = "0.6", optional = true }
directories = "6"
keyring = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
