# Build release packages for Windows, Linux, and macOS (Apple Silicon).
#
# Artifacts:
#   Windows : .exe + .zip
#   Linux   : .tar.gz + .deb + .rpm
#   macOS M : .zip (.app) + .dmg
#
# Triggers: version tags (v*) and manual workflow_dispatch.
# On tags, also publishes a GitHub Release with the same files.

name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            VERSION="${VERSION}+${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  windows:
    name: Windows (exe + zip)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Static CRT
        shell: bash
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]
          EOF

      - name: Build release
        run: cargo build --release --features postgres

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exeName = "plsqlide-$env:VERSION-windows-x86_64.exe"
          $zipName = "plsqlide-$env:VERSION-windows-x86_64.zip"
          Copy-Item target/release/plsqlide.exe "dist/$exeName"
          Compress-Archive -Path "dist/$exeName" -DestinationPath "dist/$zipName" -Force
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (tar + deb + rpm)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install packagers
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build release
        run: cargo build --release --features postgres

      - name: Package tar.gz
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/tar/plsqlide-${VERSION}-linux-x86_64
          cp target/release/plsqlide "dist/tar/plsqlide-${VERSION}-linux-x86_64/"
          cp README.md LICENSE packaging/linux/plsqlide.desktop \
            "dist/tar/plsqlide-${VERSION}-linux-x86_64/"
          tar -C dist/tar -czf "dist/plsqlide-${VERSION}-linux-x86_64.tar.gz" \
            "plsqlide-${VERSION}-linux-x86_64"

      - name: Package deb
        run: cargo deb --no-build --output dist/

      - name: Package rpm
        run: |
          cargo generate-rpm
          mkdir -p dist
          cp target/generate-rpm/*.rpm dist/

      - name: Normalize package names
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          deb=(dist/*.deb)
          rpm=(dist/*.rpm)
          [[ ${#deb[@]} -ge 1 ]] || { echo "no .deb produced"; exit 1; }
          [[ ${#rpm[@]} -ge 1 ]] || { echo "no .rpm produced"; exit 1; }
          cp "${deb[0]}" "dist/plsqlide-${VERSION}-linux-x86_64.deb"
          cp "${rpm[0]}" "dist/plsqlide-${VERSION}-linux-x86_64.rpm"
          # Drop tool-default names so the release only has stable aliases (+ tar).
          for f in "${deb[@]}" "${rpm[@]}"; do
            case "$f" in
              *-linux-x86_64.deb|*-linux-x86_64.rpm) ;;
              *) rm -f "$f" ;;
            esac
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon (zip + dmg)
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --features postgres --target aarch64-apple-darwin

      - name: Bundle zip + dmg
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x packaging/macos/bundle.sh
          mkdir -p dist
          packaging/macos/bundle.sh \
            "${VERSION}" \
            target/aarch64-apple-darwin/release/plsqlide \
            dist
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten files
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
          \) -exec cp -v {} release/ \;
          ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: PLSQL IDE ${{ needs.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
